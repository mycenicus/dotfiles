source = colors.conf
$SCRIPTS = $HOME/.config/hypr/hyprlock/
$font = JetBrainsMono Nerd Font

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $image

    color = rgb(0,0,0) # color will be rendered initially until path is available

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 5
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}


# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $primary
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(000000ff)
    shadow_boost = 1.2
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0

    position = 0, 220
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $primary
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(000000ff)
    shadow_boost = 1.2
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0

    position = 0, 80
    halign = center
    valign = center
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    shadow_passes = 1
    shadow_boost = 0.5
    color = $secondary
    font_size = 18
    font_family = $font

    position = 0, -15
    halign = center
    valign = center
}

# Week
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = $secondary
    shadow_passes = 1
    shadow_boost = 0.5
    font_size = 14
    font_family = $font 10

    position = 0, -40
    halign = center
    valign = center
}

label { # Battery
    monitor =
    text = cmd[update:1000] echo -e "$($SCRIPTS/battery.sh)"
    color = $on_tertiary_container
    font_size = 14
    font_family = $font

    position = 37, -29
    halign = left
    valign = top
    zindex = 5
}

shape { # Battery BG
    monitor =
    size = 91, 40

    shadow_passes = 1
    shadow_boost  = 0.5

    color         = $surface
    rounding      = -1
    border_size   = 0
    border_color  =

    position = 20, -22
    halign   = left
    valign   = top
    zindex   = 1
}

label { # Network
    monitor =
    text = cmd[update:1000] echo -e "$($SCRIPTS/network.sh)"
    color = $on_tertiary_container
    font_size = 12
    font_family = $font

    position = 37, -80
    halign = left
    valign = top
    zindex = 5
}

shape { # Network BG
    monitor =
    size = 145, 40

    shadow_passes = 1
    shadow_boost  = 0.5

    color         = $surface
    rounding      = -1
    border_size   = 0
    border_color  =

    position = 20, -72
    halign   = left
    valign   = top
    zindex   = 1
}

label { # Bluetooth
    monitor =
    text = cmd[update:1000] echo -e "$($SCRIPTS/bluetooth.sh)"
    color = $on_tertiary_container
    font_size = 12
    font_family = $font

    position = 37, -135
    halign = left
    valign = top
    zindex = 5
}

shape { # Bluetooth BG
    monitor =
    size = 155, 40

    shadow_passes = 1
    shadow_boost  = 0.5

    color         = $surface
    rounding      = -1
    border_size   = 0
    border_color  =

    position = 20, -127
    halign   = left
    valign   = top
    zindex   = 1
}

label { # Degrees
    monitor =
    text = cmd[update:18000000] echo "<big> $(curl -s --fail 'wttr.in?format=%c+%C+%t' | tr -d '+') </big>"
    color = $on_tertiary_container
    font_size = 14
    font_family = $font

    position = 20, -190
    halign = left
    valign = top

    zindex = 5
}

shape { # Degrees BG
    monitor =
    size = 207, 40

    shadow_passes = 1
    shadow_boost  = 0.5

    color         = $surface
    rounding      = -1
    border_size   = 0
    border_color  =

    position = 20, -183
    halign   = left
    valign   = top
    zindex   = 1
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rouding = -1

    rounding = 22
    outer_color = $source_color
    inner_color = rgba(255, 255, 255, 0.1)

    font_color = $secondary
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    check_color = $tertiary
    capslock_color = $on_surface
    swap_font_color = true

    position = 0, 120
    halign = center
    valign = bottom
}
